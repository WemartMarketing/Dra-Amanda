<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',board:'<rect x="3" y="4" width="7" height="16" rx="1"/><rect x="12" y="4" width="9" height="8" rx="1"/><rect x="12" y="14" width="9" height="6" rx="1"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',chart:'<path d="M4 20V12M10 20V4M16 20V9M22 20V7"/>',location:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M15 7h1M9 11h2M15 11h1M9 15h2M15 15h1M11 21v-4h3v4"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.7 2.8a2 2 0 0 1-.5 2.1L7.5 10a16 16 0 0 0 6.5 6.5l1.4-1.8a2 2 0 0 1 2.1-.5 12 12 0 0 0 2.8.7 2 2 0 0 1 1.7 1.9Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',check:'<path d="m5 12 4 4L19 6"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7l0-8Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',whatsapp:'<path d="M21 11a9 9 0 0 1-13.4 7.8L3 21l2.2-4.6A9 9 0 1 1 21 11Z"/><path d="M9 8c0 3 4 7 7 7"/>',note:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m12 2 2 2 3-1 1 3 3 2-1 3 2 2-2 2 1 3-3 2-1 3-3-1-2 2-2-2-3 1-1-3-3-2 1-3-2-2 2-2-1-3 3-2 1-3 3 1Z"/>',filter:'<path d="M4 4h16l-6 8v7l-4 2v-9Z"/>',more:'<circle cx="5" cy="12" r= function ico(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.home}</svg>`}
const pages=[['inicio','Início','home'],['kanban','Meus leads','board'],['ficha','Ficha do lead','person'],['gestor','Relatórios','chart'],['roletas','Roletas','location'],['acessos','Usuários e acessos','shield']];
let screen=(new URLSearchParams(location.search)).get('tela')||'inicio';if(!pages.some(p=>p[0]===screen))screen='inicio';let selectedRoleta=0;
function head(eyebrow,title,desc,act=''){return `<div class="header"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${act}</div></div>`}
function btn(text,fn,kind='',ic=''){return `<button class="btn ${kind}" onclick="${fn}">${ic?ico(ic):''}${text}</button>`}
function stat(label,num,foot,ic='users',kind='',delta=''){return `<div class="stat"><div class="upper"><div class="stat-label">${label}</div><div class="stat-icon ${kind}">${ico(ic)}</div></div><div class="number">${num}</div><div class="foot">${delta?`<span class="delta ${kind==='red'?'red':''}">${delta}</span> · `:''}${foot}</div></div>`}
function setScreen(x){screen=x;history.replaceState({},'',location.pathname+'?tela='+x);render();window.scrollTo({top:0,behavior:'instant'})}
function toast(text){let e=document.getElementById('toast');e.textContent=text;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),3500)}

utton><button onclick="toast('Agenda de demonstração')">${ico('calendar')}Minha agenda</button></div><div class="alertBox" style="margin-top:18px;border-color:#eae7fb;background:#f9f8ff;color:#605c8b">${ico('bolt',17)} <b style="color:#5f56dc">Dica rápida:</b> atualize a etapa do lead logo após cada contato.</div></section></div>`}

mar visita."></textarea></div><div class="field"><label>Próximo passo</label><select><option>Ligar novamente</option><option>Agendar visita</option><option>Solicitar documentos</option><option>Enviar proposta</option></select></div><div class="field"><label>Data do retorno</label><input type="date" value="2026-11-07"/></div>${btn('Salvar atendimento',"toast('Atendimento de demonstração atualizado')",'primary tall','check')}<div class="divider"></div><h2 style="font-size:15px;margin-bottom:20px">Histórico</h2><div class="timeline"><div class="event"><strong>Lead atribuído a Carlos Silva</strong><p>Origem: roleta Casa HM — Zona Oeste</p><small>Hoje, 10h30</small></div><div class="event"><strong>Primeiro contato realizado</strong><p>Cliente demonstrou interesse no imóvel.</p><small>Hoje, 11h05</small></div></div></section><section class="panel"><div class="panelhead"><h2>Próximas ações</h2></div><div class="presence" style="background:#f8f7ff;border-color:#ebe7ff;color:#6258dd">${ico('calendar',23)}<div><strong>Retorno amanhã</strong><small>07/11/2026</small></div></div><div class="task" style="min-height:0"><input type="checkbox" aria-label="Retornar contato"/><div class="taskbody"><strong>Retornar contato</strong><small>Confirmar disponibilidade</small></div></div><div class="task" style="min-height:0"><input type="checkbox" aria-label="Enviar condições"/><div class="taskbody"><strong>Enviar condições</strong><small>Informar entrada e mensais</small></div></div>${btn('Adicionar tarefa',"toast('Tarefa criada no protótipo')",'soft','plus')}<div class="divider"></div><div class="alertBox"><b>Regra de atenção:</b> leads sem feedback por 4 dias podem ser redistribuídos.</div></section></div>`}

ss="track"><div class="fill" style="width:${pct}%"></div></div><span>${val}</span></div>`).join('')}</div><div class="divider"></div><div style="display:flex;justify-content:space-between"><span class="muted">Conversão geral</span><strong>3,4%</strong></div></section></div><div class="grid2"><section class="panel"><div class="panelhead"><h2>Resultado por empreendimento</h2>${btn('Ver relatório completo',"toast('Relatório detalhado no produto final')",'','arrow')}</div><table class="table"><thead><tr><th>Empreendimento</th><th>Leads</th><th>Vendas</th><th>Conversão</th></tr></thead><tbody>${products.map(([p,l,v,c])=>`<tr><td><b>${p}</b></td><td>${l}</td><td>${v}</td><td><span class="pill">${c}</span></td></tr>`).join('')}</tbody></table></section><section class="panel"><div class="panelhead"><div><h2>Oportunidades perdidas</h2><p class="subtitle">Por falta de atuação dentro do prazo</p></div><span class="pill red">Atenção</span></div><div style="display:flex;align-items:center;gap:20px"><div style="font-family:Manrope;font-weight:800;font-size:67px;color:#de6371">38</div><div><strong>Leads redistribuídos</strong><p class="subtitle">A equipe anterior perdeu acesso aos cadastros.</p></div></div><div class="divider"></div><div class="pipeline">${[['Sem primeiro contato',78,20],['Sem retorno atualizado',58,14],['Outros motivos',18,4]].map(([n,v,c])=>`<div class="pipe" style="grid-template-columns:156px 1fr 28px"><span>${n}</span><div class="track"><div class="fill" style="background:#e67b87;width:${v}%"></div></div><span>${c}</span></div>`).join('')}</div></section></div>`}

initials,color],i)=>`<div class="roster"><div class="avatar ${color}">${initials}</div><div><b>${n}</b><small style="display:block;color:#939dac;margin-top:4px">${desc}</small></div><span class="pill ${i===2?'red':''}">${i===2?'Bloqueado':'Disponível'}</span></div>`).join('')}</div>`}
function acessos(){let roles=[['Master','Toda a empresa','1'],['GP Líder','Todos os produtos','2'],['Gerente Geral','Todos os produtos','1'],['GP do Produto','Produtos vinculados','5'],['Superintendente','Sua superintendência','3'],['Gerente','Sua equipe','16'],['Corretor','Sua própria carteira','89']];return head('ADMINISTRAÇÃO','Usuários e permissões','Defina funções e controle o que cada pessoa pode acessar.',btn('Criar função',"toast('Formulário de criação de função na versão funcional')",'primary','plus'))+`<div class="stats">${stat('Usuários ativos','117','nesta empresa','users')}${stat('Funções criadas','7','permissões configuráveis','shield')}${stat('Superintendências','3','hierarquias comerciais','building')}${stat('Corretores','89','vinculados à operação','person')}</div><div class="grid2"><section class="panel"><div class="panelhead"><div><h2>Funções da empresa</h2><p class="subtitle">Cada cargo tem um escopo de visualização definido.</p></div></div><table class="table"><thead><tr><th>Função</th><th>Escopo de acesso</th><th>Usuários</th><th></th></tr></thead><tbody>${roles.map(([n,scope,q])=>`<tr><td><b>${n}</b></td><td>${scope}</td><td>${q}</td><td><button class="circle-btn" aria-label="Ver cargo ${n}" style="width:30px;height:30px" onclick="toast('Configuração de ${n}')">${ico('more',14)}</button></td></tr>`).join('')}</tbody></table></section><section class="panel"><div class="panelhead"><div><h2>Como funcionam os acessos?</h2><p class="subtitle">Permissões por função + limites de dados</p></div></div><div class="task"><div class="stat-icon">${ico('shield')}</div><div class="taskbody"><strong>Master WeMart</strong><small>Administra clientes e configurações da plataforma.</small></div></div><div class="task"><div class="stat-icon">${ico('building')}</div><div class="taskbody"><strong>Master da empresa</strong><small>Administra somente a própria empresa.</small></div></div><div class="task"><div class="stat-icon">${ico('users')}</div><div class="taskbody"><strong>Gestores comerciais</strong><small>Veem somente os escopos autorizados.</small></div></div><div class="task"><div class="stat-icon">${ico('person')}</div><div class="taskbody"><strong>Corretor</strong><small>Visualiza os leads atribuídos à sua carteira.</small></div></div><div class="alertBox" style="margin-top:18px;border-color:#e8e5fb;background:#f9f8ff;color:#656181">Se o lead mudar de equipe ou superintendência, a equipe anterior perde acesso imediatamente. A perda fica registrada nos relatórios agregados.</div></section></div>`}
function exportCSV(){let rows=[['Empreendimento','Leads','Vendas','Conversão'],['Smart Marquês',486,19,'3,9%'],['Vila das Belezas',372,13,'3,5%'],['Freguesia do Ó',285,9,'3,2%']];let csv='\uFEFF'+rows.map(r=>r.join(';')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='wemart-sales-relatorio-exemplo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Relatório de exemplo exportado em CSV, compatível com Excel')}

render();
